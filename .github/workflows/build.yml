name: Build Firmware

on:
  push:
    branches:
      - main
      - fixbuild
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: |
          docker build -t oboo-builder .

      - name: Run firmware build
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/build \
            -w /build \
            oboo-builder \
            bash ./build.sh

      - name: Dump CMake errors
        if: failure()
        run: |
          find build_dir -name CMakeError.log -exec echo "==== {} ====" \; -exec cat {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/**
            build_dir/**
            output/**
            build/**
            dist/**
