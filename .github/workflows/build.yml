name: Build Firmware

on:
  push:
    branches:
      - main
      - fixbuild

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure a git tag exists for CMake's git describe
        run: |
          git fetch --tags || true
          if [ -z "$(git tag)" ]; then
            git tag -f build-baseline
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache

      - name: Build Docker image
        run: docker build -t oboo-builder .

      - name: Run firmware build
        run: |
          docker run --rm \
            -u $(id -u):0 \
            -v ${{ github.workspace }}:/build \
            -w /build \
            oboo-builder \
            ./build.sh

      - name: Show last build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -200 build.log
          fi

      - name: Dump CMake errors
        if: failure()
        run: |
          find build_dir -name CMakeError.log \
            -exec echo "==== {} ====" \; \
            -exec cat {} \; || true

          find build_dir -name CMakeOutput.log \
            -exec echo "==== {} ====" \; \
            -exec tail -200 {} \; || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/**