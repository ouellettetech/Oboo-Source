name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            nodejs \
            npm

      # - name: Install JS dependencies
      #   run: |
      #     if [ -f package.json ]; then
      #       npm install
      #     fi

      - name: Run tests
        run: |
          if [ -f package.json ]; then
            npm test || true
          fi

      - name: Build firmware
        run: |
          chmod +x ./build.sh || true
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            output/**
            build/**
            dist/**